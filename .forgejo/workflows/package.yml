name: package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
      - name: 'Run: Package'
        run: ./build.cmd Package
      - name: 'Artifacts: bin'
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: package
          path: bin/*.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - secret-check
      - package
    if: needs.secret-check.outputs.has-thunderstore-secret == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: package
          path: bin/
      - name: Publish to Thunderstore
        env:
          THUNDERSTORE_API_KEY: ${{ secrets.THUNDERSTORE_API_KEY }}
          TAG: ${{ forgejo.ref_name }}
        run: |-
          ./build.cmd publish \
            --thunderstore-token "$THUNDERSTORE_API_KEY" \
            --tag "$TAG" \
            --artifact-dir bin/
      - name: Create release
        uses: https://code.forgejo.org/actions/forgejo-release@98265452477dafb3f0f27ba9c462c90b18cb44fd # v2.13.4
        with:
          direction: upload
          tag: ${{ forgejo.ref_name }}
          release-dir: bin

  secret-check:
    runs-on: ubuntu-latest
    outputs:
      has-thunderstore-secret: ${{ secrets.THUNDERSTORE_API_KEY != '' }}
    steps:
      - run: echo no-op
